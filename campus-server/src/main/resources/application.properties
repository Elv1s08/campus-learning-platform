spring.application.name=campus-server
spring.datasource.url=jdbc:mysql://localhost:3306/campus_learning?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.upload-dir=${UPLOAD_DIR:./uploads}
### restrain the size of document ###
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
### embedding model application ###
app.embedding.base-url=http://127.0.0.1:1234
app.embedding.model=text-embedding-qwen3-embedding-0.6b
app.qdrant.base-url=http://127.0.0.1:6333
app.qdrant.collection=knowledge_qwen3_0_6b
### chat model application ###
app.chat.base-url=http://127.0.0.1:1234
app.chat.model=qwen/qwen3-4b-2507